name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publishing is a repository setting the workflow cannot flip itself.
      # Until it is on, a push skips the deploy with a notice instead of failing.
      - name: Is Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository; skipping the deploy."
          fi

      # Publish tracked files only. `git archive` is the guard: a checkout
      # directory can also hold untracked local material (tokens, scratch
      # worktrees) that must never reach a public site.
      - name: Build the site from tracked files
        if: steps.pages.outputs.ready == 'true'
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          test ! -e _site/.secrets
          test ! -e _site/node_modules
          test -e _site/gallery/index.html

      - if: steps.pages.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
