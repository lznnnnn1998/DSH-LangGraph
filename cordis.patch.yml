# Registers the LangGraph workflow tools. Graphs live in the package's `graphs/`
# directory; `config.graphs` adds more modules, `config.recursionLimit` bounds a run,
# `config.model` overrides the route graph nodes use for model calls, `config.trace:
# false` turns off the Trajectory sub-call trace, `config.prompt: false` turns off
# the model-facing system-prompt graph guidance, `config.background: false` hides
# background runs, `config.subagentProvider` selects the provider for
# `helpers.subagent` (default `spawn`), and `config.store: false` passes no
# long-term BaseStore to graphs. Threads are checkpointed in the
# `langgraph_checkpoints` storage domain and keep `config.retention` checkpoints
# each (default 200; 0 is unlimited); long-term memories live in
# `langgraph_store`.
- insert:
    - id: langgraph
      name: '@lzn1998/dsh-langgraph'
      config: {}
